<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product cart</title>
</head>
<body>
<div class="product-card" data-product-id="99401">
    <div class="badge-row">
        <span class="badge">Bestseller</span>
    </div>
    <h3 class="product-title">Wireless Noise-Canceling Headphones</h3>
    <div class="price-box">
        <span class="currency">₹</span>
        <span class="amount">4,999</span>
    </div>
    <div class="quantity-section">
        <label>Select Qty:</label>
        <input type="number" id="qty_883920" class="qty-input" value="1" min="1" max="5" />
    </div>
    <div class="button-group">
        <button type="button" class="btn-cart">Add to Wishlist</button>
        <button type="button" class="btn-cart">Add to Cart</button>
    </div>
</div>

</body>
</html>
